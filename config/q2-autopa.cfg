# QIDI Q2 production AutoPA configuration.
# Include this file from printer.cfg with:
#   [include q2-autopa.cfg]
#
# IMPORTANT: the production calibration protocol also requires the [extruder]
# max_extrude_cross_section guard to be high enough for the validated in-air
# tiny-wobble composite moves. The installer does NOT modify that safety guard.
# See docs/INSTALL.md and docs/SAFETY.md.

[q2_loadcell]
poll_hz: 40
samples_per_second: 40
tare_time: 0.35

[autopa]
capture_dir: /home/mks/printer_data/autopa/captures
profile_path: /home/mks/printer_data/autopa/profiles.json
save_captures: True
sweep_min_segment_samples: 12
sweep_min_segment_rate_hz: 35
