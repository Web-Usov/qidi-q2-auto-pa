# Minimal QIDI Q2 additions for the validated AutoPA Sweep path.
#
# Do NOT copy printer.cfg.q2stage wholesale. Add only these sections/options
# to an already-working QIDI Q2 configuration after installing q2_loadcell.py
# and upstream autopa.

[q2_loadcell]
# Host-side polling rate of QIDI probe_air.sensor_helper.read_origin_data().
# Successful validation captures measured ~37-38 Hz actual incoming rate.
poll_hz: 40

# Compatibility metadata exposed to autopa/Klipper consumers. This does not
# force the physical sensor path to produce 40 unique samples every second.
samples_per_second: 40

tare_time: 0.35

[autopa]
capture_dir: /home/mks/printer_data/autopa/captures
profile_path: /home/mks/printer_data/autopa/profiles.json
save_captures: True

# Q2-specific quality gates. Upstream defaults are intentionally stricter and
# assume a faster load-cell transport.
sweep_min_segment_samples: 12
sweep_min_segment_rate_hz: 35
